services:
  postgres:
    image: postgres:18.6
    container_name: postgres-zanbilak
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    external: true
    name: 3edcf8bf6a492cc0c22ad7b0dfdf4b1d2096fa0a1442d94847e6827db9a67597
